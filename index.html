{d:5,n:2,q:"Una sesión de Claude Code de ocho horas produjo decisiones de arquitectura importantes en las primeras dos. El equipo quiere conservarlas y a la vez contener el costo de la sesión.",o:["Desactivar la compactación y trabajar con la ventana de contexto completa","Escribir las decisiones en archivos del repositorio a medida que se toman y dejar que la compactación libere el historial, que deja de ser la fuente de verdad","Reiniciar la sesión cada hora y volver a explicar el contexto","Solicitar resúmenes progresivamente más extensos para no perder detalle"],a:1,e:"Los dos objetivos solo entran en conflicto si la conversación es la memoria. Al persistir las decisiones en archivos, compactar deja de ser una pérdida y pasa a ser una ventaja de costo. Desactivar la compactación solo adelanta el agotamiento del contexto."},
{d:5,n:2,q:"Un agente en integración continua abrió una solicitud de extracción afirmando que corrigió el error y que la suite pasa. El tablero de CI muestra todo en verde. ¿Primer paso antes de fusionar?",o:["Fusionar: la verificación automática ya está en verde y fue independiente del agente","Revisar el diff de los archivos de prueba y la cobertura del cambio, porque la suite también puede quedar en verde si se modificaron, debilitaron o deshabilitaron pruebas","Volver a ejecutar la integración continua para confirmar que el verde es estable","Pedirle al agente que confirme explícitamente que no alteró las pruebas"],a:1,e:"El verde de CI es evidencia de que la suite pasa, no de que la suite siga siendo exigente. Cuando quien escribe el código también puede escribir las pruebas, hay que verificar el diff de las pruebas. Reejecutar confirma estabilidad, no rigor."}
];

const LIMITE=720, MIN=60, K_HIST="cca_hist2", K_CURR="cca_curr2";
let S=null, reloj=null, avance=null;
const app=document.getElementById("app");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const hhmm=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const guardar=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const leer=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const borrar=k=>{try{localStorage.removeItem(k)}catch(e){}};
const mezclar=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nivelDe=q=>q.n||1;
const porDominio=(d,niv)=>BANK.map((q,i)=>(q.d===d&&(niv==="mixto"||(niv==="dificil"?nivelDe(q)===2:nivelDe(q)===1)))?i:-1).filter(i=>i>=0);
const cuotaDe=niv=>niv==="dificil"?CUOTA_DIF:CUOTA;
const largoDe=niv=>niv==="dificil"?25:30;
const minutosDe=niv=>niv==="dificil"?50:60;
const preg=n=>BANK[S.orden[n]];
const opciones=n=>S.opts[n].map(k=>preg(n).o[k]);
const clave=n=>S.opts[n].indexOf(preg(n).a);
const total=()=>S.orden.length;

function valido(c){return !!c&&Array.isArray(c.orden)&&c.orden.length>0&&
  c.orden.every(i=>Number.isInteger(i)&&i>=0&&i<BANK.length)&&
  Array.isArray(c.opts)&&c.opts.length===c.orden.length&&
  c.opts.every(o=>Array.isArray(o)&&o.length===4)&&
  Array.isArray(c.resp)&&c.resp.length===c.orden.length&&
  Array.isArray(c.flags)&&c.flags.length===c.orden.length}

function muestrear(modo,dom,cant,niv){
  let sel=[];
  if(modo==="examen"){
    const q=cuotaDe(niv);
    [1,2,3,4,5].forEach(d=>{sel=sel.concat(mezclar(porDominio(d,niv).slice()).slice(0,q[d]))});
    sel=mezclar(sel);
  }else{
    const pool=mezclar(porDominio(dom,niv).slice());
    sel=cant>=pool.length?pool:pool.slice(0,cant);
  }
  return sel;
}

function iniciar(modo,dom,cant,cron,niv){
  const orden=muestrear(modo,dom,cant,niv);
  if(!orden.length){alert("No hay preguntas para esa combinación.");return}
  S={modo:modo,dom:dom,niv:niv,fase:"examen",orden:orden,
     opts:orden.map(()=>mezclar([0,1,2,3])),
     i:0,resp:orden.map(()=>null),flags:orden.map(()=>false),
     cron:cron,seg:cron?(modo==="examen"?minutosDe(niv)*60:Math.max(600,orden.length*150)):0,pausa:false};
  tick();pintar();
}

function tick(){
  clearInterval(reloj);
  if(!S||!S.cron)return;
  reloj=setInterval(()=>{
    if(!S||S.fase!=="examen"||S.pausa)return;
    S.seg--;guardar(K_CURR,S);
    if(S.seg<=0){entregar()}
    else{const c=document.getElementById("clock");
      if(c){c.textContent=hhmm(S.seg);c.className="clock"+(S.seg<300?" low":"")}}
  },1000);
}

function entregar(){clearInterval(reloj);clearTimeout(avance);S.fase="resultado";borrar(K_CURR);archivar();pintar()}

function archivar(){
  let ok=0;S.orden.forEach((_,n)=>{if(S.resp[n]===clave(n))ok++});
  const h=leer(K_HIST)||[];
  h.unshift({f:new Date().toLocaleString("es-CR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}),
    p:Math.round(ok/total()*1000),ok:ok,n:total(),
    m:(S.modo==="examen"?"Examen":"Práctica · "+SHORT[S.dom])+" · "+(NIV[S.niv]||"Básico")});
  guardar(K_HIST,h.slice(0,15));
}

function pintar(){
  if(!S||S.fase==="inicio")inicio();
  else if(S.fase==="examen")examen();
  else resultado();
  window.scrollTo(0,0);
}

function inicio(){
  const h=leer(K_HIST)||[];let curr=leer(K_CURR);
  if(curr&&!valido(curr)){borrar(K_CURR);curr=null}
  const nB=BANK.filter(q=>nivelDe(q)===1).length, nD=BANK.filter(q=>nivelDe(q)===2).length;
  app.innerHTML=
  '<p class="eyebrow">Simulacro de certificación</p>'+
  '<h1>Claude Certified Architect · Foundations</h1>'+
  '<p class="lede">Banco de '+BANK.length+' escenarios: '+nB+' de nivel básico y '+nD+' de nivel difícil · cada intento toma preguntas distintas al azar</p>'+
  (curr?'<div class="note"><strong>Hay un intento sin terminar.</strong> '+curr.resp.filter(x=>x!==null).length+' de '+curr.orden.length+' respondidas'+(curr.cron?', '+hhmm(curr.seg)+' en el reloj':'')+'.<div class="row" style="margin-top:10px"><button class="btn-go" onclick="retomar()">Retomar intento</button><button onclick="descartar()">Descartar</button></div></div>':'')+
  '<div class="card"><h2>Examen completo</h2>'+
  '<div class="row" style="margin-bottom:12px"><span class="lbl">Nivel</span><select id="nivEx" onchange="pintaCuota()">'+
  '<option value="mixto">Mixto · 30 preguntas, 60 min (recomendado)</option>'+
  '<option value="basico">Básico · 30 preguntas, 60 min</option>'+
  '<option value="dificil">Difícil · 25 preguntas, 50 min</option>'+
  '</select></div>'+
  '<div id="cuota"></div>'+
  '<div class="row" style="margin-top:14px"><label class="chk"><input type="checkbox" id="cronEx" checked> Con cronómetro</label></div>'+
  '<div class="row" style="margin-top:14px"><button class="btn-go" onclick="goExamen()">Comenzar examen</button></div></div>'+
  '<div class="card"><h2>Práctica por dominio</h2>'+
  '<p style="font-size:14px;color:var(--ink-2);margin:0 0 14px">Para machacar el tema donde el diagnóstico te salga corto.</p>'+
  '<div class="row"><span class="lbl">Dominio</span><select id="selDom" onchange="pintaDisp()">'+
  [1,2,3,4,5].map(d=>'<option value="'+d+'">'+DOM[d]+'</option>').join("")+'</select></div>'+
  '<div class="row" style="margin-top:10px"><span class="lbl">Nivel</span><select id="nivPr" onchange="pintaDisp()">'+
  '<option value="mixto">Mixto</option><option value="basico">Básico</option><option value="dificil">Difícil</option></select>'+
  '<span class="lbl">Cantidad</span><select id="selCant">'+
  '<option value="10">10</option><option value="15">15</option><option value="99">Todas</option></select>'+
  '<label class="chk" style="margin-left:6px"><input type="checkbox" id="cronPr"> Con reloj</label></div>'+
  '<p id="disp" class="lbl" style="margin:10px 0 0"></p>'+
  '<div class="row" style="margin-top:14px"><button onclick="goPractica()">Comenzar práctica</button></div></div>'+
  (h.length?'<div class="card"><h2>Intentos anteriores</h2>'+
    h.map(x=>'<div class="hist"><span>'+esc(x.f)+'</span><span style="color:var(--ink-3)">'+esc(x.m)+'</span><span>'+x.ok+'/'+x.n+' · <strong style="color:'+(x.p>=LIMITE?"var(--ok)":"var(--no)")+'">'+x.p+'</strong></span></div>').join("")+
    '<div class="row" style="margin-top:12px"><button onclick="limpiar()">Borrar historial</button></div></div>':'')+
  pie();
  pintaCuota();pintaDisp();
}

function pintaCuota(){
  const el=document.getElementById("cuota");if(!el)return;
  const niv=document.getElementById("nivEx").value,q=cuotaDe(niv);
  el.innerHTML=[1,2,3,4,5].map(d=>{const disp=porDominio(d,niv).length;
    return '<div class="spread" style="padding:6px 0;border-bottom:1px solid var(--rule)"><span style="font-size:13.5px">'+DOM[d]+'</span><span class="mono" style="font-size:12.5px;color:'+(disp<q[d]?"var(--no)":"var(--ink-3)")+'">'+Math.min(q[d],disp)+' de '+disp+' · '+PESO[d]+'</span></div>'}).join("")+
    '<p class="lbl" style="margin:10px 0 0">Corte en '+LIMITE+' sobre 1000. El reparto por dominio respeta la ponderación oficial.</p>';
}

function pintaDisp(){
  const el=document.getElementById("disp");if(!el)return;
  const d=parseInt(document.getElementById("selDom").value,10),niv=document.getElementById("nivPr").value;
  el.textContent="Disponibles con esa combinación: "+porDominio(d,niv).length+" preguntas.";
}

function examen(){
  const n=S.i,q=preg(n),ops=opciones(n),hechas=S.resp.filter(x=>x!==null).length,T=total();
  app.innerHTML=
  '<div class="spread" style="margin-bottom:16px">'+
    '<span class="mono" style="font-size:12.5px;color:var(--ink-3)">'+String(n+1).padStart(2,"0")+' / '+T+' · '+hechas+' respondidas'+(S.modo==="practica"?" · práctica":"")+'</span>'+
    (S.cron?'<div class="row"><span class="clock'+(S.seg<300?" low":"")+'" id="clock">'+hhmm(S.seg)+'</span><button onclick="pausar()" style="padding:4px 11px;font-size:13px">'+(S.pausa?"Reanudar":"Pausar")+'</button></div>':'<span class="mono" style="font-size:12.5px;color:var(--ink-3)">sin reloj</span>')+
  '</div>'+
  (S.pausa?'<div class="card" style="text-align:center;padding:44px 22px"><p style="margin:0;color:var(--ink-2)">Intento en pausa. El reloj está detenido.</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn-go" onclick="pausar()">Reanudar</button></div></div>':
  '<div class="card">'+
    '<div class="spread" style="margin-bottom:14px"><div class="row" style="gap:6px"><span class="tag">'+SHORT[q.d]+'</span>'+(nivelDe(q)===2?'<span class="tag tag-dif">Difícil</span>':'')+'</div>'+
    '<button onclick="marcar()" style="padding:4px 11px;font-size:13px;'+(S.flags[n]?"background:var(--flag-bg);color:var(--flag);border-color:var(--flag)":"")+'">'+(S.flags[n]?"Marcada":"Marcar para revisar")+'</button></div>'+
    '<p style="font-size:15.5px;margin:0 0 16px">'+esc(q.q)+'</p>'+
    (q.c?'<div class="code">'+esc(q.c)+'</div>':'')+
    ops.map((o,k)=>'<div class="opt'+(S.resp[n]===k?" sel":"")+'" tabindex="0" role="button" onclick="elegir('+k+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();elegir('+k+')}"><span class="ltr">'+"ABCD"[k]+'</span><span>'+esc(o)+'</span></div>').join("")+
  '</div>')+
  '<div class="row" style="margin-top:14px"><button onclick="mover(-1)"'+(n===0?" disabled":"")+'>Anterior</button>'+
  '<button onclick="mover(1)"'+(n===T-1?" disabled":"")+'>Siguiente</button>'+
  '<button class="btn-go" style="margin-left:auto" onclick="confirmar()">Entregar</button></div>'+
  '<div class="grid">'+S.orden.map((_,k)=>'<button class="cell'+(S.resp[k]!==null?" done":"")+(S.flags[k]?" flag":"")+(k===n?" here":"")+'" onclick="saltar('+k+')" aria-label="Pregunta '+(k+1)+'">'+(k+1)+'</button>').join("")+'</div>'+
  '<p style="font-size:12.5px;color:var(--ink-3);margin-top:12px">Atajos: A B C D para responder · flechas para navegar · M para marcar</p>';
}

function resultado(){
  let ok=0;const dom={};[1,2,3,4,5].forEach(d=>dom[d]=[0,0]);
  S.orden.forEach((idx,n)=>{const q=BANK[idx];dom[q.d][1]++;if(S.resp[n]===clave(n)){ok++;dom[q.d][0]++}});
  const T=total(),pct=ok/T,pts=Math.round(pct*1000),pasa=pts>=LIMITE;
  const activos=[1,2,3,4,5].filter(d=>dom[d][1]>0);
  app.innerHTML=
  '<p class="eyebrow">'+(S.modo==="examen"?"Resultado del examen":"Práctica · "+esc(SHORT[S.dom]))+' · nivel '+esc((NIV[S.niv]||"Básico").toLowerCase())+'</p>'+
  '<div class="card">'+
    '<div class="row" style="align-items:baseline;gap:14px"><span class="score">'+pts+'</span>'+
    '<span style="color:var(--ink-2)">de 1000 · '+ok+' de '+T+' correctas ('+Math.round(pct*100)+'%)</span></div>'+
    '<div class="scale"><div class="fill" style="width:'+Math.max(1,pct*100)+'%"></div><div class="cut" style="left:'+(LIMITE/10)+'%"></div></div>'+
    '<div class="scale-lab"><span>0</span><span style="color:var(--no)">corte '+LIMITE+'</span><span>1000</span></div>'+
    '<p style="margin:14px 0 0"><span class="tag '+(pasa?"tag-ok":"tag-no")+'">'+(pasa?"Sobre la línea de corte":"Bajo la línea de corte")+'</span></p>'+
  '</div>'+
  (activos.length>1?'<div class="card"><h2>Diagnóstico por dominio</h2>'+
  activos.map(d=>{const p=dom[d][0]/dom[d][1];
    return '<div class="dom"><div class="dom-head"><span>'+DOM[d]+' <span class="mono" style="color:var(--ink-3);font-size:12px">'+PESO[d]+'</span></span><span class="mono" style="color:var(--ink-2)">'+dom[d][0]+'/'+dom[d][1]+'</span></div>'+
    '<div class="bar"><div class="fill" style="width:'+Math.max(1,p*100)+'%;background:'+(p>=0.7?"var(--ok)":"var(--flag)")+'"></div><div class="tick"></div></div></div>'}).join("")+
  '<p style="font-size:13px;color:var(--ink-3);margin:6px 0 0">La marca vertical señala el 70%. Los dominios por debajo son los que conviene repasar primero, ponderados por su peso en el examen.</p>'+
  '<div class="row" style="margin-top:12px">'+activos.filter(d=>dom[d][0]/dom[d][1]<0.7).map(d=>'<button onclick="practicaRapida('+d+')">Practicar '+esc(SHORT[d])+'</button>').join("")+'</div></div>':'')+
  '<div class="row" style="margin-top:16px"><button class="btn-go" onclick="volver()">Volver al inicio</button></div>'+
  '<div class="rule"></div><h2>Revisión pregunta por pregunta</h2>'+
  S.orden.map((idx,n)=>{const q=BANK[idx],ops=opciones(n),c=clave(n),bien=S.resp[n]===c;
    return '<div class="rev'+(bien?"":" wrong")+'">'+
    '<div class="spread" style="margin-bottom:9px"><span class="mono" style="font-size:12px;color:var(--ink-3)">'+String(n+1).padStart(2,"0")+' · '+esc(SHORT[q.d])+(nivelDe(q)===2?' · difícil':'')+'</span>'+
    '<span class="tag '+(bien?"tag-ok":"tag-no")+'">'+(bien?"Correcta":S.resp[n]===null?"Sin responder":"Incorrecta")+'</span></div>'+
    '<p style="margin:0 0 12px;font-size:14.5px">'+esc(q.q)+'</p>'+
    (q.c?'<div class="code">'+esc(q.c)+'</div>':'')+
    ops.map((o,k)=>'<div class="opt'+(k===c?" key":(S.resp[n]===k?" bad":""))+'" style="cursor:default;margin-bottom:6px"><span class="ltr">'+"ABCD"[k]+'</span><span>'+esc(o)+'</span></div>').join("")+
    '<p class="why">'+esc(q.e)+'</p></div>'}).join("")+
  pie();
}

function pie(){
  return '<div class="foot">Simulacro de práctica preparado con Claude para Oscar Quirós · agosto 2026 · banco de '+BANK.length+' preguntas.<br>'+
  'Las preguntas son de elaboración propia y no provienen del examen oficial de Anthropic: sirven para entrenar el razonamiento por escenarios, no para anticipar contenidos. '+
  'Confirmá formato, dominios y requisitos vigentes en la guía oficial del examen antes de inscribirte.</div>';
}

function goExamen(){const niv=document.getElementById("nivEx").value;
  iniciar("examen",null,largoDe(niv),document.getElementById("cronEx").checked,niv)}
function goPractica(){const niv=document.getElementById("nivPr").value;
  iniciar("practica",parseInt(document.getElementById("selDom").value,10),
    parseInt(document.getElementById("selCant").value,10),document.getElementById("cronPr").checked,niv)}
function practicaRapida(d){iniciar("practica",d,10,false,S&&S.niv?S.niv:"mixto")}
function retomar(){const c=leer(K_CURR);
  if(valido(c)){S=c;S.pausa=false;S.fase="examen";tick();pintar()}
  else{borrar(K_CURR);S=null;alert("El intento guardado no se pudo recuperar. Se empieza uno nuevo.");pintar()}}
function descartar(){borrar(K_CURR);pintar()}
function limpiar(){if(confirm("¿Borrar el historial de intentos?")){borrar(K_HIST);pintar()}}
function elegir(k,ya){clearTimeout(avance);S.resp[S.i]=k;guardar(K_CURR,S);
  const ultima=S.i>=total()-1;
  if(ya&&!ultima){S.i++;pintar();return}
  pintar();
  if(!ultima){avance=setTimeout(()=>{S.i++;pintar()},140)}}
function marcar(){S.flags[S.i]=!S.flags[S.i];guardar(K_CURR,S);pintar()}
function mover(d){clearTimeout(avance);S.i=Math.min(total()-1,Math.max(0,S.i+d));pintar()}
function saltar(k){clearTimeout(avance);S.i=k;pintar()}
function pausar(){S.pausa=!S.pausa;pintar()}
function volver(){clearInterval(reloj);S=null;pintar()}
function confirmar(){
  const faltan=S.resp.filter(x=>x===null).length,marcadas=S.flags.filter(Boolean).length;
  let m="¿Entregar el intento?";
  if(faltan)m+="\n\nQuedan "+faltan+" preguntas sin responder.";
  if(marcadas)m+="\nTenés "+marcadas+" marcadas para revisar.";
  if(confirm(m))entregar();
}
document.addEventListener("keydown",e=>{
  if(!S||S.fase!=="examen"||S.pausa)return;
  const k=e.key.toUpperCase();
  if("ABCD".includes(k)&&!e.metaKey&&!e.ctrlKey){e.preventDefault();elegir("ABCD".indexOf(k),true)}
  else if(e.key==="ArrowRight"){mover(1)}
  else if(e.key==="ArrowLeft"){mover(-1)}
  else if(k==="M"){marcar()}
});
pintar();
</script>
